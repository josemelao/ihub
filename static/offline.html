<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0F1115" />
		<title>Meu Hub está offline</title>
		<style>
			:root {
				color-scheme: dark;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: #0f1115;
				color: #e8eaf0;
				font-family:
					Inter,
					system-ui,
					-apple-system,
					sans-serif;
				padding: 24px;
			}
			main {
				width: min(520px, 100%);
				background: #161a21;
				border: 1px solid #262c37;
				border-radius: 16px;
				padding: 28px;
			}
			.mark {
				display: grid;
				place-items: center;
				width: 48px;
				height: 48px;
				border-radius: 14px;
				background: #8aa4ff;
				color: #0b1020;
				font-weight: 700;
				font-size: 24px;
				margin-bottom: 18px;
			}
			h1 {
				margin: 0 0 8px;
				font-size: 22px;
			}
			p {
				margin: 0 0 16px;
				color: #9aa3b2;
				line-height: 1.55;
			}
			code {
				background: #1b2029;
				border: 1px solid #262c37;
				border-radius: 6px;
				padding: 2px 6px;
				color: #c9cfda;
			}
			a {
				display: inline-block;
				background: #8aa4ff;
				color: #0b1020;
				text-decoration: none;
				font-weight: 600;
				padding: 10px 16px;
				border-radius: 10px;
			}
		</style>
	</head>
	<body>
		<main>
			<div class="mark">H</div>
			<h1>Meu Hub está offline</h1>
			<p>
				O servidor local não respondeu. Ele roda apenas no seu computador, em
				<code>127.0.0.1:5757</code>.
			</p>
			<p>
				Abra um terminal na pasta do projeto e rode <code>npm start</code>. Depois tente
				novamente.
			</p>
			<a href="/">Tentar de novo</a>
		</main>
	</body>
</html>
